spring.application.name=identity-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/identity_db}
spring.datasource.username=${DB_USERNAME:identity_user}
spring.datasource.password=${DB_PASSWORD:identity_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:this-is-a-test-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration=3600
jwt.issuer=identity-service

# Initial Admin Account
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.initial-admin.employee-number=${INITIAL_ADMIN_EMPLOYEE_NUMBER:ADMIN-001}
app.initial-admin.full-name=${INITIAL_ADMIN_FULL_NAME:System Administrator}
