
services:
  identity-db:
    image: postgres:17
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_password
    ports:
      - "5433:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ticket-db:
    image: postgres:17
    container_name: ticket-db
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    ports:
      - "5434:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  assignment-db:
    image: postgres:17
    container_name: assignment-db
    environment:
      POSTGRES_DB: assignment_db
      POSTGRES_USER: assignment_user
      POSTGRES_PASSWORD: assignment_password
    ports:
      - "5435:5432"
    volumes:
      - assignment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignment_user -d assignment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  identity-service:
    build:
      context: ./identity-service
    container_name: identity-service
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: identity_password
      JWT_SECRET: ${JWT_SECRET:-this-is-a-test-secret-key-that-is-at-least-32-bytes-long}
    depends_on:
      identity-db:
        condition: service_healthy

  ticket-service:
    build:
      context: ./ticket-service
    container_name: ticket-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://ticket-db:5432/ticket_db
      DB_USERNAME: ticket_user
      DB_PASSWORD: ticket_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-this-is-a-test-secret-key-that-is-at-least-32-bytes-long}
    depends_on:
      ticket-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  assignment-service:
    build:
      context: ./assignment-service
    container_name: assignment-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://assignment-db:5432/assignment_db
      DB_USERNAME: assignment_user
      DB_PASSWORD: assignment_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-this-is-a-test-secret-key-that-is-at-least-32-bytes-long}
    depends_on:
      assignment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/maintenance-ticket-frontend
    container_name: maintenance-frontend
    ports:
      - "80:80"
    depends_on:
      - identity-service
      - ticket-service
      - assignment-service

  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  identity-db-data:
  ticket-db-data:
  assignment-db-data:
  prometheus-data:
  grafana-data:
