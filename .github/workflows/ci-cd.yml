
name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # ==============================
  # Backend Tests and Build
  # ==============================
  backend-tests:
    name: Backend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start PostgreSQL and Kafka
        run: docker compose up -d --wait identity-db ticket-db assignment-db kafka

      - name: Build and Test Identity Service
        working-directory: identity-service
        env:
          DB_URL: jdbc:postgresql://localhost:5433/identity_db
          DB_USERNAME: identity_user
          DB_PASSWORD: identity_password
          JWT_SECRET: this-is-a-test-secret-key-that-is-at-least-32-bytes-long
        run: mvn -B clean verify

      - name: Build and Test Ticket Service
        working-directory: ticket-service
        env:
          DB_URL: jdbc:postgresql://localhost:5434/ticket_db
          DB_USERNAME: ticket_user
          DB_PASSWORD: ticket_password
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: this-is-a-test-secret-key-that-is-at-least-32-bytes-long
        run: mvn -B clean verify

      - name: Build and Test Assignment Service
        working-directory: assignment-service
        env:
          DB_URL: jdbc:postgresql://localhost:5435/assignment_db
          DB_USERNAME: assignment_user
          DB_PASSWORD: assignment_password
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: this-is-a-test-secret-key-that-is-at-least-32-bytes-long
        run: mvn -B clean verify

      - name: Stop Test Infrastructure
        if: always()
        run: docker compose down -v --remove-orphans


  # ==============================
  # Frontend Tests and Build
  # ==============================
  frontend-checks:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/maintenance-ticket-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/maintenance-ticket-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend
        run: npm run build


  # ==============================
  # Final Pipeline Result
  # ==============================
  pipeline-result:
    name: CI Pipeline Result
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-checks

    if: always()

    steps:
      - name: Check Pipeline Results
        run: |
          echo "Backend result: ${{ needs.backend-tests.result }}"
          echo "Frontend result: ${{ needs.frontend-checks.result }}"

          if [[ "${{ needs.backend-tests.result }}" != "success" || "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "CI Pipeline Failed!"
            exit 1
          fi

          echo "CI Pipeline Passed Successfully!"
