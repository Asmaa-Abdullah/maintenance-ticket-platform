
spring.application.name=assignment-service

server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/assignment_db}
spring.datasource.username=${DB_USERNAME:assignment_user}
spring.datasource.password=${DB_PASSWORD:assignment_password}

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

jwt.secret=${JWT_SECRET:this-is-a-test-secret-key-that-is-at-least-32-bytes-long}

springdoc.swagger-ui.persist-authorization=true

spring.kafka.consumer.group-id=assignment-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
