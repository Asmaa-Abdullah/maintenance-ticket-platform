
spring.application.name=ticket-service

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/ticket_db}
spring.datasource.username=${DB_USERNAME:ticket_user}
spring.datasource.password=${DB_PASSWORD:ticket_password}

spring.flyway.enabled=true

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ticket-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.maintenance.ticket.ticket.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.maintenance.ticket.ticket.event.TicketAssignedEvent
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.properties.spring.json.type.mapping=com.maintenance.assignment.assignment.event.TicketAssignedEvent:com.maintenance.ticket.ticket.event.TicketAssignedEvent

logging.level.org.springframework.kafka=DEBUG

jwt.secret=${JWT_SECRET:this-is-a-test-secret-key-that-is-at-least-32-bytes-long}

# Management & Monitoring
management.server.port=9080
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
